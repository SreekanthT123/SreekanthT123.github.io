<section appRevealOnScroll class="mb-16 scroll-mt-24 md:mb-24">
  <h2 class="text-sm font-bold uppercase tracking-widest text-slate-100">Experience</h2>
  <ol class="relative mt-8 space-y-14 border-l border-slate-700 pl-8">
    @for (job of experience; track job.company) {
      <li class="group relative">
        <span
          class="absolute -left-8 top-1.5 h-2.5 w-2.5 -translate-x-1/2 rounded-full bg-slate-600 ring-4 ring-slate-950 transition-colors group-hover:bg-teal-300"
        ></span>

        <span class="font-mono text-xs text-slate-500">
          {{ job.startDate }} — {{ job.endDate }}
        </span>
        <h3 class="mt-2 text-base font-medium text-slate-100">
          {{ job.role }}
        </h3>
        <p class="mt-1 text-sm text-teal-300">{{ job.company }}</p>
        <p class="mt-1 text-xs text-slate-500">{{ job.location }}</p>

        <ul class="mt-5 space-y-4 text-sm leading-7 text-slate-400">
          @for (point of job.highlights; track point) {
            <li class="relative pl-6">
              <span class="absolute left-0 top-[0.7em] h-1 w-1 rounded-full bg-slate-600"></span>
              {{ point }}
            </li>
          }
        </ul>
      </li>
    }
  </ol>
</section>
