<section appRevealOnScroll class="mb-16 scroll-mt-24 md:mb-24">
  <h2 class="text-sm font-bold uppercase tracking-widest text-slate-100">Skills</h2>
  <div class="mt-6 space-y-6">
    @for (group of skills; track group.category) {
      <div>
        <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-500">{{ group.category }}</h3>
        <ul class="mt-3 flex flex-wrap gap-2">
          @for (item of group.items; track item) {
            <li
              class="rounded-full border border-slate-700 px-3 py-1 text-xs text-slate-300 transition-colors hover:border-teal-300/60 hover:text-teal-300"
            >
              {{ item }}
            </li>
          }
        </ul>
      </div>
    }
  </div>
</section>
